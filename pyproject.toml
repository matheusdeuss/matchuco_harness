[project]
name = "matchuco"
version = "0.1.0"
description = "A multi-provider agentic coding harness, built from scratch to learn how tools like Claude Code work."
readme = "README.md"
authors = [
    { name = "0matheusfilipe", email = "matheusfilipedesilva@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
keywords = ["agents", "llm", "agentic-harness", "anthropic", "openai", "tool-use"]
dependencies = [
    "anthropic>=1.8.0,<2",
    "openai>=3.19.2,<4",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
matchuco = "matchuco.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
